<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-label="Khili - Data scientist with a statistician's eye.">
<title>Khili - Data scientist with a statistician's eye.</title>
<style>
text{font-family:Georgia, 'Times New Roman', 'Liberation Serif', serif}
.kick{font-size:13px;letter-spacing:.22em;fill:#E39AA4}
.name{font-size:76px;font-weight:700;fill:#EEE7D6;letter-spacing:-.01em}
.tag{font-size:21px;font-style:italic;fill:#EEE7D6}
.sub{font-size:13.5px;fill:#A3ABBA}
.axis{stroke:#A3ABBA;stroke-width:1.2;fill:none}
.lbl{font-size:13px;font-style:italic;fill:#A3ABBA}
.bar{fill:#3A4D78;transform-box:fill-box;transform-origin:50% 100%;animation:bar 12s ease-in-out infinite both}
.curve{fill:none;stroke:#E39AA4;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;animation:draw 12s ease-in-out infinite both}
.area{fill:#E39AA4;fill-opacity:.14;animation:fade 12s ease-in-out infinite both}
.mean{stroke:#E39AA4;stroke-width:1.3;stroke-dasharray:4 4;animation:fade 12s ease-in-out infinite both}
.dot{animation:fade 12s ease-in-out infinite both}
.reveal{transform-box:fill-box;transform-origin:0 50%;animation:type 12s infinite both}
.tagwrap{animation:hold 12s ease-in-out infinite both}
.caret{fill:#E39AA4;animation:caret 12s infinite both}
.rise{animation:rise 1.2s ease-out both}
@keyframes bar{0%{opacity:0;transform:scaleY(.04)}4%{opacity:1}22%{transform:scaleY(1)}90%{opacity:1;transform:scaleY(1)}97%,100%{opacity:0;transform:scaleY(1)}}
@keyframes draw{0%,10%{stroke-dashoffset:1;opacity:1}34%{stroke-dashoffset:0}90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes fade{0%,28%{opacity:0}38%{opacity:1}90%{opacity:1}97%,100%{opacity:0}}
@keyframes type{0%{transform:scaleX(0)}4%{transform:scaleX(0);animation-timing-function:steps(41,end)}28%,100%{transform:scaleX(1)}}
@keyframes hold{0%,2%{opacity:1}90%{opacity:1}97%,100%{opacity:0}}
@keyframes caret{0%,3%{opacity:0;transform:translateX(0)}4%{opacity:1;transform:translateX(0);animation-timing-function:steps(41,end)}28%{opacity:1;transform:translateX(380px)}36%{opacity:0}44%{opacity:1}52%{opacity:0}60%{opacity:1}68%{opacity:0}76%{opacity:1}84%{opacity:0}89%,100%{opacity:0;transform:translateX(380px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.d1{animation-delay:.05s}.d2{animation-delay:.2s}.d3{animation-delay:.5s}
@media (prefers-reduced-motion:reduce){*{animation:none !important}.caret{display:none}}
</style>
